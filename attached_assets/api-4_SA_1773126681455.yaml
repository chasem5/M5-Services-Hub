  '/v1/service-agreements/{serviceAgreementId}/budgets/initialize':
    post:
      tags:
        - Service Agreement Budgets
      summary: Initialize budget structure
      description: |
        Initializes the budget structure for a service agreement. Creates monthly budget records and
        budget buckets for all months in the service agreement period. Automatically creates budget
        buckets for all active cost types at $0. Handles both TOGETHER mode (contract-wide budgets)
        and SEPARATE mode (per-property budgets) based on the service agreement's bundle mode.
      operationId: initialize-service-agreement-budgets
      parameters:
        - $ref: '#/components/parameters/Authorization'
        - $ref: '#/components/parameters/tenantId'
        - name: serviceAgreementId
          in: path
          description: Service agreement ID
          required: true
          schema:
            type: string
            format: uuid
            example: 2cdc8ab1-6d50-49cc-ba14-54e4ac7ec231
      responses:
        '204':
          description: Budget structure successfully initialized (No Content)
        '400':
          $ref: '#/components/responses/400-Bad-Request'
        '404':
          description: Service agreement not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
        '422':
          description: Unresolved bulk operations exist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
      security:
        - authorization: []
      servers:
        - url: 'https://public-api.live.buildops.com'
          description: Production Server
        - url: 'https://public-api.dev.buildops.com'
          description: Development Server
  '/v1/service-agreements/{serviceAgreementId}/budgets/buckets':
    patch:
      tags:
        - Service Agreement Budgets
      summary: Update budget buckets
      description: |
        Updates multiple budget buckets in a single request. Validates that all bucket IDs belong
        to the specified service agreement and tenant. Supports partial updates - only fields
        provided in the request will be updated.
      operationId: update-budget-buckets
      parameters:
        - $ref: '#/components/parameters/Authorization'
        - $ref: '#/components/parameters/tenantId'
        - name: customerPropertyId
          in: query
          description: Customer property ID (required for SEPARATE property bundle mode)
          required: false
          schema:
            type: string
            nullable: true
            format: uuid
            example: 2cdc8ab1-6d50-49cc-ba14-54e4ac7ec231
        - name: serviceAgreementId
          in: path
          description: Service agreement ID
          required: true
          schema:
            type: string
            format: uuid
            example: 2cdc8ab1-6d50-49cc-ba14-54e4ac7ec231
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BudgetBucketListUpdateRequest'
            examples:
              default:
                value:
                  budgetBuckets:
                    - id: 2cdc8ab1-6d50-49cc-ba14-54e4ac7ec231
                      amount: 2000
                      hours: 50
                      laborRate: 75
                    - id: 3ddc9bc2-7e61-50dd-cb25-65f5bd8fd342
                      amount: 1500
      responses:
        '200':
          description: Successfully updated budget buckets
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BudgetBucketListUpdateResponse'
        '400':
          $ref: '#/components/responses/400-Bad-Request'
        '404':
          description: Service agreement or budget buckets not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
        '422':
          description: 'Validation error (e.g., duplicate bucket IDs, buckets don''t belong to SA)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
      security:
        - authorization: []
      servers:
        - url: 'https://public-api.live.buildops.com'
          description: Production Server
        - url: 'https://public-api.dev.buildops.com'
          description: Development Server
components:

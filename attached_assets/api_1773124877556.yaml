openapi: 3.0.3
info:
  version: 1.0.0
  title: Master Data
  description: Master Data API endpoints
  contact:
    name: BuildOps Support
    url: 'https://buildops.com/support'
    email: support@buildops.com
servers:
  - url: 'https://public-api.live.buildops.com'
    description: Production Server
  - url: 'https://public-api.dev.buildops.com'
    description: Development Server
paths:
  /v1/customers:
    get:
      tags:
        - Customers
      summary: Get Customers List
      description: 'This endpoint retrieves all customers associated with a tenant. Customers are individuals or companies that have a relationship with the given tenant. The endpoint returns a list of customer objects containing relevant information such as customer ID, name, contact details, and any other associated data. The response will reflect the customers specifically tied to the provided tenant ID'
      operationId: get-v1-customers
      parameters:
        - $ref: '#/components/parameters/Authorization'
        - $ref: '#/components/parameters/tenantId'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - name: include_inactive
          in: query
          description: if true the list will return all customers including inactive ones
          schema:
            type: string
            default: 'false'
      responses:
        '200':
          description: |
            List of customers filtered by tenant id.
          content:
            application/json:
              schema:
                type: object
                properties:
                  totalCount:
                    type: number
                    description: Total items of records on this request.
                  items:
                    type: array
                    description: Array of customers.
                    items:
                      $ref: '#/components/schemas/Customer'
        '400':
          $ref: '#/components/responses/400-Bad-Request'
        '401':
          $ref: '#/components/responses/401-Unauthorized'
        '403':
          $ref: '#/components/responses/403-Forbidden'
        '500':
          $ref: '#/components/responses/500-Internal-Server-Error'
      security:
        - authorization: []
      servers:
        - url: 'https://public-api.live.buildops.com'
          description: Production Server
        - url: 'https://public-api.dev.buildops.com'
          description: Development Server
    post:
      tags:
        - Customers
      summary: Create a customer
      description: |-
        The 'create customer' endpoint is responsible for adding a new customer associated with a specific tenant. By using this endpoint, you can submit the necessary data to create a new customer object, including information such as customer ID, name, contact details, and any other relevant data associated with the customer.

        When making a request to this endpoint through the API with the appropriate parameters, a new customer will be created and linked to the tenant identified by its ID. The endpoint will return a response indicating the success or outcome of the customer creation operation.

        It is important to note that creating a customer requires including all mandatory and valid information necessary for the customer to be properly registered in the system. Make sure to provide the correct data when using this endpoint to avoid errors and ensure that the new customer is successfully added to the corresponding tenant.
      operationId: post-v1-customers
      parameters:
        - $ref: '#/components/parameters/Authorization'
        - $ref: '#/components/parameters/tenantId'
      requestBody:
        description: ''
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                accountNumber:
                  type: string
                  nullable: true
                customerType:
                  type: string
                  nullable: true
                isActive:
                  type: boolean
                  nullable: true
                email:
                  type: string
                  nullable: true
                  format: email
                customerNumber:
                  type: string
                  nullable: true
                creditLimit:
                  type: number
                  nullable: true
                isTaxable:
                  type: boolean
                  nullable: true
                taxRateValue:
                  type: number
                  nullable: true
                taxCodeId:
                  type: string
                  nullable: true
                  format: uuid
                sameAddress:
                  type: boolean
                  nullable: true
                phonePrimary:
                  type: string
                  nullable: true
                  example: 555-123-1234
                phoneAlternate:
                  type: string
                  nullable: true
                  example: 555-123-1234
                receiveSMS:
                  type: boolean
                  nullable: true
                taxExemptIdValue:
                  type: string
                  nullable: true
                taxRateId:
                  type: string
                  nullable: true
                  format: uuid
                paymentTermId:
                  type: string
                  nullable: true
                  format: uuid
                invoicePresetId:
                  type: string
                  nullable: true
                  format: uuid
                invoiceDeliveryPref:
                  type: string
                  nullable: true
                priceBookId:
                  type: string
                  nullable: true
                  format: uuid
                status:
                  type: string
                  enum:
                    - active
                    - inactive
                    - disabled
                  default: active
                accountingAttributes:
                  type: object
                  nullable: true
                  properties:
                    accountingRefId:
                      type: string
                      nullable: true
                    accountingVersion:
                      type: string
                      nullable: true
                addresses:
                  type: array
                  nullable: true
                  items:
                    $ref: '#/components/schemas/Address_2'
              required:
                - name
      responses:
        '201':
          description: Customer created with successfull.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
        '400':
          $ref: '#/components/responses/400-Bad-Request'
        '401':
          $ref: '#/components/responses/401-Unauthorized'
        '403':
          $ref: '#/components/responses/403-Forbidden'
        '409':
          $ref: '#/components/responses/409-Conflict-Record'
        '500':
          $ref: '#/components/responses/500-Internal-Server-Error'
        '502':
          description: Bad Gateway
        '503':
          description: Service Unavailable
        '504':
          description: Gateway Timeout
      security:
        - authorization: []
      servers:
        - url: 'https://public-api.live.buildops.com'
          description: Production Server
        - url: 'https://public-api.dev.buildops.com'
          description: Development Server
  '/v1/customers/{id}':
    get:
      tags:
        - Customers
      summary: Get Customer by ID
      description: |-
        The 'get customer by customer id' endpoint allows you to retrieve a specific customer's information based on their unique customer ID. By using this endpoint, you can provide the customer ID as a parameter in the API request to fetch the relevant customer object.

        Upon a successful request to this endpoint, the API will return detailed information about the customer associated with the provided customer ID. This information may include the customer's name, contact details, and any other associated data specific to that customer.

        It's important to note that the customer ID must be accurate and valid to ensure the retrieval of the correct customer data. Additionally, if the customer ID provided does not match any existing customer in the system, the API will respond with an appropriate error message indicating that the customer could not be found.
      operationId: get-v1-customers-id
      parameters:
        - $ref: '#/components/parameters/Authorization'
        - $ref: '#/components/parameters/tenantId'
        - name: id
          in: path
          description: Customer ID
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Get Customer by customer ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
        '400':
          $ref: '#/components/responses/400-Bad-Request'
        '401':
          $ref: '#/components/responses/401-Unauthorized'
        '403':
          $ref: '#/components/responses/403-Forbidden'
        '404':
          $ref: '#/components/responses/404-Not-Found'
        '500':
          $ref: '#/components/responses/500-Internal-Server-Error'
        '502':
          description: Bad Gateway
        '503':
          description: Service Unavailable
        '504':
          description: Gateway Timeout
      security:
        - authorization: []
      servers:
        - url: 'https://public-api.live.buildops.com'
          description: Production Server
        - url: 'https://public-api.dev.buildops.com'
          description: Development Server
    put:
      tags:
        - Customers
      summary: Update a Customer by ID
      description: |-
        The 'Update a customer by Id' allows you to update the information of an existing customer.

        When using the 'Update a customer by Id' method, you will need to provide the updated data for the customer in the request body. This could include changes to the customer's name, contact details, or any other associated information.

        Upon a successful request to this endpoint, the API will process the provided data and apply the updates to the corresponding customer record. The response will confirm the successful update, along with any relevant details about the modified customer.

        It is crucial to ensure that the customer ID provided in the request matches an existing customer in the system. Additionally, the data sent in the request body must be accurate and properly formatted to avoid any unintended changes or errors during the update process.
      operationId: put-v1-customers-id
      parameters:
        - $ref: '#/components/parameters/Authorization'
        - $ref: '#/components/parameters/tenantId'
        - name: id
          in: path
          description: Customer ID
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                accountNumber:
                  type: string
                  nullable: true
                customerType:
                  type: string
                  nullable: true
                customerTypeValue:
                  type: string
                  description: 'Deprecated: use customerType instead'
                isActive:
                  type: boolean
                  nullable: true
                email:
                  type: string
                  nullable: true
                  format: email
                customerNumber:
                  type: string
                  nullable: true
                creditLimit:
                  type: number
                  nullable: true
                isTaxable:
                  type: boolean
                  nullable: true
                taxRateValue:
                  type: number
                  nullable: true
                taxCodeId:
                  type: string
                  nullable: true
                  format: uuid
                sameAddress:
                  type: boolean
                  nullable: true
                phonePrimary:
                  type: string
                  nullable: true
                  example: 555-123-1234
                phoneAlternate:
                  type: string
                  nullable: true
                  example: 555-123-1234
                receiveSMS:
                  type: boolean
                  nullable: true
                taxExemptIdValue:
                  type: string
                  nullable: true
                taxRateId:
                  type: string
                  nullable: true
                  format: uuid
                paymentTermId:
                  type: string
                  nullable: true
                  format: uuid
                invoicePresetId:
                  type: string
                  nullable: true
                  format: uuid
                invoiceDeliveryPref:
                  type: string
                  nullable: true
                priceBookId:
                  type: string
                  nullable: true
                  format: uuid
                status:
                  type: string
                  enum:
                    - active
                    - inactive
                    - disabled
                  default: active
                accountingAttributes:
                  type: object
                  nullable: true
                  properties:
                    accountingRefId:
                      type: string
                      nullable: true
                    accountingVersion:
                      type: string
                      nullable: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
        '400':
          $ref: '#/components/responses/400-Bad-Request'
        '401':
          $ref: '#/components/responses/401-Unauthorized'
        '403':
          $ref: '#/components/responses/403-Forbidden'
        '404':
          $ref: '#/components/responses/404-Not-Found'
        '409':
          $ref: '#/components/responses/409-Conflict-Record'
        '500':
          $ref: '#/components/responses/500-Internal-Server-Error'
        '502':
          description: Bad Gateway
        '503':
          description: Service Unavailable
        '504':
          description: Gateway Timeout
      security:
        - authorization: []
      servers:
        - url: 'https://public-api.live.buildops.com'
          description: Production Server
        - url: 'https://public-api.dev.buildops.com'
          description: Development Server

          in: query
          required: false
          schema:
            type: integer
            format: int32
            default: 0
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            format: int32
            default: 20
        - name: sortBy
          in: query
          required: false
          schema:
            type: string
            default: createdDateTime
        - name: sortOrder
          in: query
          required: false
          schema:
            type: string
            default: desc
        - name: filters
          in: query
          required: false
          schema:
            type: array
            default: []
            items:
              $ref: '#/components/schemas/EmployeeRequestFilter'
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/NewGenericListResponsePublicEmployeePayload'
        '400':
          description: Bad Request
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/GenericApiErrorApiErrorDetail'
      security:
        - authorization: []
      servers:
        - url: 'https://public-api.live.buildops.com'
          description: Production Server
        - url: 'https://public-api.dev.buildops.com'
          description: Development Server

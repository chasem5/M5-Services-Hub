components:
  parameters:
    Page:
      name: page
      in: query
      description: Page number for pagination
      schema:
        type: number
        minimum: 0
        default: 0
    Limit:
      name: limit
      in: query
      description: Number of items per page
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    page_size:
      name: page_size
      in: query
      description: Number of items per page
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 10
    include_inactive:
      name: include_inactive
      in: query
      description: Include inactive records in results
      schema:
        type: boolean
        default: false
    Authorization:
      name: Authorization
      in: header
      description: Bearer token for authentication
      required: true
      schema:
        type: string
        example: Bearer your-jwt-token-here
    tenantId:
      name: tenantId
      in: header
      description: Tenant ID for the request
      required: true
      schema:
        type: string
        format: uuid
        example: 123e4567-e89b-12d3-a456-426614174000
  securitySchemes:
    authorization:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    400-Bad-Request:
      description: 'Bad Request: Invalid or missing parameters.'
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
                example: Bad Request
              message:
                type: string
                example: Invalid request parameters
    401-Unauthorized:
      description: 'Unauthorized: User is not authenticated.'
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
                example: Unauthorized
              message:
                type: string
                example: Authentication required
    403-Forbidden:
      description: 'Forbidden: User lacks required permissions.'
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
                example: Forbidden
              message:
                type: string
                example: Insufficient permissions
    404-Not-Found:
      description: 'Not Found: The resource with the given ID does not exist.'
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
                example: Not Found
              message:
                type: string
                example: Resource not found
    409-Conflict-Record:
      description: 'Conflict: The record already exists or conflicts with existing data.'
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
                example: Conflict
              message:
                type: string
                example: Record already exists
    500-Internal-Server-Error:
      description: An unexpected error occurred on the server.
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
                example: Internal Server Error
              message:
                type: string
                example: An unexpected error occurred
  schemas:
    Customer:
      type: object
      properties:
        id:
          type: string
          description: GUID.  Key for this record.
          format: uuid
          example: 11785575-1328-4063-9683-e2f7a18d5a7d
        name:
          type: string
          nullable: true
        accountNumber:
          type: string
          nullable: true
        customerType:
          type: string
          nullable: true
        isActive:
          type: boolean
          nullable: true
        email:
          type: string
          nullable: true
        customerNumber:
          type: string
          nullable: true
        creditLimit:
          type: number
          nullable: true
        isTaxable:
          type: boolean
          nullable: true
        taxRateValue:
          type: number
          nullable: true
        taxCodeId:
          $ref: '#/components/schemas/taxCodeId'
        sameAddress:
          type: boolean
          nullable: true
        phonePrimary:
          type: string
          nullable: true
        phoneAlternate:
          type: string
          nullable: true
        receiveSMS:
          type: boolean

    delete:
      tags:
        - Tasks
      summary: Delete task by ID
      description: |-
        The "DELETE" method for the "task" endpoint allows you to perform a soft delete on a specific task based on its unique task ID. Soft delete means that instead of permanently removing the task from the system, the task's status will be updated to indicate that it has been deleted (isActive = false), but its data will be retained for auditing purposes or potential future reactivation.

        When using this endpoint, you will provide the task ID as a parameter in the API request to identify the task that needs to be soft deleted.

        Upon a successful request to this endpoint, the API will process the provided task ID and locate the corresponding task record in the system. The task associated with the provided ID will then have its status changed to indicate that it is deleted but its data will remain in the system.
      operationId: delete-v1-tasks-taskId
      parameters:
        - $ref: '#/components/parameters/Authorization'
        - $ref: '#/components/parameters/tenantId'
        - name: taskId
          in: path
          description: Task ID
          required: true
          schema:
            type: string
      responses:
        '204':
          description: No Content
        '401':
          $ref: '#/components/responses/401-Unauthorized'
        '403':
          $ref: '#/components/responses/403-Forbidden'
        '404':
          $ref: '#/components/responses/404-Not-Found'
        '500':
          $ref: '#/components/responses/500-Internal-Server-Error'
        '502':
          description: Bad Gateway
        '503':
          description: Service Unavailable
        '504':
          description: Gateway Timeout
      security:
        - authorization: []
      servers:
        - url: 'https://public-api.dev.buildops.com'
          description: Development Server
        - url: 'https://public-api.live.buildops.com'
          description: Production Server

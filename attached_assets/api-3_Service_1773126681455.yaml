openapi: 3.0.3
info:
  version: 1.0.0
  title: Service
  description: 'Service API endpoints including Jobs, Properties, Products, and more'
  contact:
    name: BuildOps Support
    url: 'https://buildops.com/support'
    email: support@buildops.com
servers:
  - url: 'https://public-api.live.buildops.com'
    description: Production Server
  - url: 'https://public-api.dev.buildops.com'
    description: Development Server
paths:
  /v1/products:
    get:
      tags:
        - Products
      summary: Get Products List
      description: 'This endpoint retrieves all products associated with a tenant. The endpoint returns a list of Product objects containing relevant information such as ID, name and any other associated data. The response will reflect the products specifically tied to the provided tenant ID.'
      operationId: get-v1-products
      parameters:
        - $ref: '#/components/parameters/Authorization'
        - $ref: '#/components/parameters/tenantId'
        - $ref: '#/components/parameters/productCode'
        - $ref: '#/components/parameters/page_size'
        - name: limit
          in: query
          description: How many items should come in the request.
          deprecated: true
          schema:
            type: string
        - name: page
          in: query
          description: Page that you want to filter.
          schema:
            type: number
            minimum: 1
            default: 1
      responses:
        '200':
          description: |
            List of products filtered by tenant id.
          content:
            application/json:
              schema:
                type: object
                properties:
                  query:
                    type: object
                    properties:
                      page:
                        type: number
                      page_size:
                        type: number
                      limit:
                        type: number
                        x-deprecated: true
                  totalCount:
                    type: number
                    description: Total items of records on this request.
                  links:
                    $ref: '#/components/schemas/Links'
                  items:
                    type: array
                    description: Array of customers.
                    items:
                      $ref: '#/components/schemas/Product'
        '400':
          $ref: '#/components/responses/400-Bad-Request'
        '401':
          $ref: '#/components/responses/401-Unauthorized'
        '403':
          $ref: '#/components/responses/403-Forbidden'
        '404':
          $ref: '#/components/responses/404-Not-Found'
        '500':
          $ref: '#/components/responses/500-Internal-Server-Error'
      security:
        - authorization: []
      servers:
        - url: 'https://public-api.live.buildops.com'
          description: Production Server
        - url: 'https://public-api.dev.buildops.com'
          description: Development Server
    post:
      tags:
        - Products
      summary: Create Product
      description: |
        Creates a new product in the system.

        When `isGeneric` is false, product manufacturer information (`productManufacturerId` and `productManufacturerNumber`) must be provided.
      operationId: post-v1-products
      parameters:
        - $ref: '#/components/parameters/Authorization'
        - $ref: '#/components/parameters/tenantId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductCreateRequest'
      responses:
        '201':
          description: Product created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '400':
          $ref: '#/components/responses/400-Bad-Request'
        '401':
          $ref: '#/components/responses/401-Unauthorized'
        '403':
          $ref: '#/components/responses/403-Forbidden'
        '500':
          $ref: '#/components/responses/500-Internal-Server-Error'
      security:
        - authorization: []
      servers:
        - url: 'https://public-api.live.buildops.com'
          description: Production Server
        - url: 'https://public-api.dev.buildops.com'
          description: Development Server
  '/v1/products/{productId}':
    get:
      tags:
        - Products
      summary: Get Product by Product ID
      description: Endpoint to get a product by Product ID
      operationId: get-v1-product-id
      parameters:
        - $ref: '#/components/parameters/Authorization'
        - $ref: '#/components/parameters/tenantId'
        - name: productId
          in: path
          description: Product ID
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Get Product by product ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '401':
          $ref: '#/components/responses/401-Unauthorized'
        '403':
          $ref: '#/components/responses/403-Forbidden'
        '404':
          $ref: '#/components/responses/404-Not-Found'
        '500':
          $ref: '#/components/responses/500-Internal-Server-Error'
        '502':
          description: Bad Gateway
        '503':
          description: Service Unavailable
        '504':
          description: Gateway Timeout
      security:
        - authorization: []
      servers:
        - url: 'https://public-api.live.buildops.com'
          description: Production Server
        - url: 'https://public-api.dev.buildops.com'
          description: Development Server
    put:
      tags:
        - Products
      summary: Update a Product by Product ID
      description: Endpoint to update a Product
      operationId: put-v1-products-id
      parameters:
        - $ref: '#/components/parameters/Authorization'
        - $ref: '#/components/parameters/tenantId'
        - $ref: '#/components/parameters/productId'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                code:
                  type: string
                  nullable: true
                name:
                  type: string
                  nullable: true
                description:
                  type: string
                markupValue:
                  type: number
                  nullable: true
                unitCost:
                  type: number
                  nullable: true
                unitPrice:
                  type: number
                  nullable: true
                taxable:
                  type: boolean
                  default: false
                unitOfMeasureId:
                  type: string
                  nullable: true
                  format: uuid
                markupType:
                  type: string
                  nullable: true
                costCodeId:
                  type: string
                  nullable: true
                  format: uuid
                revenueTypeId:
                  type: string
                  nullable: true
                  format: uuid
                jobCostTypeId:
                  type: string
                  nullable: true
                  format: uuid
                itemGlGroupId:
                  type: string
                  nullable: true
                  format: uuid
                accountingRefId:
                  type: string
                  nullable: true
                syncStatus:
                  type: string
                  nullable: true
              x-examples:
                Example 1:
                  code: '060411'
                  name: CB3500 CABINET & BLOWER PKG 1 test 4 Miguel
                  description: CB3500 CABINET & BLOWER PKG
                  markupValue: 100
                  unitCost: 1000
                  unitPrice: 1000
                  taxable: false
                  unitOfMeasureId: null
                  markupType: Percentage
                  costCodeId: null
                  revenueTypeId: null
                  jobCostTypeId: null
                  itemGlGroupId: null
                  accountingRefId: null
                  syncStatus: InSync
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '400':
          $ref: '#/components/responses/400-Bad-Request'
        '401':
          $ref: '#/components/responses/401-Unauthorized'
        '403':
          $ref: '#/components/responses/403-Forbidden'
        '404':
          $ref: '#/components/responses/404-Not-Found'
        '409':
          $ref: '#/components/responses/409-Conflict-Record'
        '500':
          $ref: '#/components/responses/500-Internal-Server-Error'
      security:
        - authorization: []
      servers:
        - url: 'https://public-api.live.buildops.com'
          description: Production Server
        - url: 'https://public-api.dev.buildops.com'
          description: Development Server
  /v1/departments:
    get:
      tags:
        - Departments
      summary: Get Departments List
      description: Get departament list
      operationId: get-v1-departaments
      parameters:
        - $ref: '#/components/parameters/Authorization'
        - $ref: '#/components/parameters/tenantId'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/page_size'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  departments:
                    type: array
                    items:
                      $ref: '#/components/schemas/Department'
        '400':
          $ref: '#/components/responses/400-Bad-Request'
        '401':
          $ref: '#/components/responses/401-Unauthorized'
        '403':
          $ref: '#/components/responses/403-Forbidden'
        '404':
          $ref: '#/components/responses/404-Not-Found'
        '500':
          $ref: '#/components/responses/500-Internal-Server-Error'
      security:
        - authorization: []
      servers:
        - url: 'https://public-api.live.buildops.com'
          description: Production Server
        - url: 'https://public-api.dev.buildops.com'
          description: Development Server
  '/v1/departments/{departmentId}':
    get:
      tags:
        - Departments
      summary: Get Department by Department ID
      description: Get department by department ID
      operationId: get-v1-departments-departmentId
      parameters:
        - $ref: '#/components/parameters/Authorization'
        - $ref: '#/components/parameters/tenantId'
        - $ref: '#/components/parameters/departmentId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  department:
                    $ref: '#/components/schemas/Department'
        '400':
          $ref: '#/components/responses/400-Bad-Request'
        '401':
          $ref: '#/components/responses/401-Unauthorized'
        '403':
          $ref: '#/components/responses/403-Forbidden'
        '404':
          $ref: '#/components/responses/404-Not-Found'
        '500':
          $ref: '#/components/responses/500-Internal-Server-Error'
      security:
        - authorization: []
      servers:
        - url: 'https://public-api.live.buildops.com'
          description: Production Server
        - url: 'https://public-api.dev.buildops.com'
          description: Development Server
  '/v1/properties/{id}':
    get:
      tags:
        - Properties
      summary: Get Property By Property ID
      description: Get Property By Property ID
      operationId: get-v1-properties-id
      parameters:
        - $ref: '#/components/parameters/Authorization'
        - $ref: '#/components/parameters/tenantId'
        - name: include_addresses
          in: query
          description: 'DEPRECATED: Use `include` instead. Include addresses.'
          schema:
            type: boolean
        - name: include
          in: query
          description: Allows to return relations
          schema:
            type: array
            items:
              type: string
              enum:
                - addresses
                - attributes
        - name: id
          in: path
          description: Property ID
          required: true
          schema:
            type: string
            format: uuid
            example: 6ab7fe81-70a2-4d64-a996-ff8f9a360862
          examples:
            default:
              value: 6ab7fe81-70a2-4d64-a996-ff8f9a360862
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerProperty'
        '400':
          $ref: '#/components/responses/400-Bad-Request'
        '401':
          $ref: '#/components/responses/401-Unauthorized'
        '403':
          $ref: '#/components/responses/403-Forbidden'
        '404':
          $ref: '#/components/responses/404-Not-Found'
        '500':
          $ref: '#/components/responses/500-Internal-Server-Error'
      security:
        - authorization: []
      servers:
        - url: 'https://public-api.live.buildops.com'
          description: Production Server
        - url: 'https://public-api.dev.buildops.com'
          description: Development Server
      x-internal: false
    put:
      tags:
        - Properties
      summary: Update Property By Property ID
      description: Update Property By Property ID
      operationId: put-v1-properties-id
      parameters:
        - $ref: '#/components/parameters/Authorization'
        - $ref: '#/components/parameters/tenantId'
        - name: id
          in: path
          description: Property ID
          required: true
          schema:
            type: string
            format: uuid
            example: 6ab7fe81-70a2-4d64-a996-ff8f9a360862
          examples:
            default:
              value: 6ab7fe81-70a2-4d64-a996-ff8f9a360862
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                companyName:
                  type: string
                  nullable: true
                accountNumber:
                  type: string
                  nullable: true
                customerPropertyTypeValue:
                  type: string
                  nullable: true
                billTo:
                  type: string
                  nullable: true
                billingCustomerId:
                  type: string
                  nullable: true
                isActive:
                  type: boolean
                  default: true
                status:
                  type: string
                  default: active
                isTaxable:
                  type: boolean
                  nullable: true
                sameAddress:
                  type: boolean
                  nullable: true
                taxCodeId:
                  type: string
                  nullable: true
                  format: uuid
                priceBookId:
                  type: string
                  nullable: true
                  format: uuid
              x-examples:
                Example 1:
                  companyName: Test Public API 12 - DEV
                  accountNumber: '1234'
                  customerPropertyTypeValue: Automation-customerPropertyTypes-1680694426775
                  billTo: Test
                  billingCustomerId: ea36c491-c610-433f-8a8b-3f992a0bd14f
                  isActive: true
                  status: active
                  isTaxable: false
                  sameAddress: false
                  taxCodeId: '{% uuid ''v4'' %}'
                  priceBookId: c57d5acc-656b-4a94-909d-efa631606883
                  notes:
                    - note: test public api
                    - note: test public api 2
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerProperty'
        '400':
          $ref: '#/components/responses/400-Bad-Request'
        '401':
          $ref: '#/components/responses/401-Unauthorized'
        '403':
          $ref: '#/components/responses/403-Forbidden'
        '404':
          $ref: '#/components/responses/404-Not-Found'
        '500':
          $ref: '#/components/responses/500-Internal-Server-Error'
      security:
        - authorization: []
      servers:
        - url: 'https://public-api.live.buildops.com'
          description: Production Server
        - url: 'https://public-api.dev.buildops.com'
          description: Development Server
      x-internal: false
  /v1/properties:
    post:
      tags:
        - Properties
      summary: Create a Property
      description: Create a Property
      operationId: post-v1-properties
      parameters:
        - $ref: '#/components/parameters/Authorization'
        - $ref: '#/components/parameters/tenantId'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                customerId:
                  type: string
                  format: uuid
                companyName:
                  type: string
                  nullable: true
                accountNumber:
                  type: string
                  nullable: true
                customerPropertyTypeValue:
                  type: string
                  nullable: true
                billTo:
                  type: string
                  nullable: true
                billingCustomerId:
                  type: string
                  nullable: true
                isTaxable:
                  type: boolean
                  default: false
                sameAddress:
                  type: boolean
                  default: false
                taxCodeId:
                  type: string
                  nullable: true
                priceBookId:
                  type: string
                  nullable: true
                addressLine1:
                  type: string
                  nullable: true
                city:
                  type: string
                  nullable: true
                state:
                  type: string
                  nullable: true
                zipcode:
                  type: string
                  nullable: true
                latitude:
                  type: number
                  nullable: true
                longitude:
                  type: number
                  nullable: true
                addressType:
                  type: string
                  nullable: true
                country:
                  type: string
                  nullable: true
                syncStatus:
                  type: string
                  nullable: true
              required:
                - customerId
                - latitude
                - longitude
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerProperty'
        '400':
          $ref: '#/components/responses/400-Bad-Request'
        '401':
          $ref: '#/components/responses/401-Unauthorized'
        '403':
          $ref: '#/components/responses/403-Forbidden'
        '404':
          $ref: '#/components/responses/404-Not-Found'
        '500':
          $ref: '#/components/responses/500-Internal-Server-Error'
      security:
        - authorization: []
      servers:
        - url: 'https://public-api.live.buildops.com'
          description: Production Server
        - url: 'https://public-api.dev.buildops.com'
          description: Development Server
      x-internal: false
    get:
      tags:
        - Properties
      summary: Get Properties by tenantId
      description: Get Properties by tenantId
      operationId: get-v1-properties
      parameters:
        - $ref: '#/components/parameters/Authorization'
        - $ref: '#/components/parameters/tenantId'
        - name: include_addresses
          in: query
          description: Allows to return properties with his addresses.
          schema:
            type: boolean
            default: false
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/page_size'
        - name: include_inactive
          in: query
          description: 'If this parameter is passed as true, this endpoint will return inactive vendors.'
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  query:
                    $ref: '#/components/schemas/QueryBody'
                  totalCount:
                    type: number
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/CustomerProperty'
        '400':
          $ref: '#/components/responses/400-Bad-Request'
        '401':
          $ref: '#/components/responses/401-Unauthorized'
        '403':
          $ref: '#/components/responses/403-Forbidden'
        '404':
          $ref: '#/components/responses/404-Not-Found'
        '500':
          $ref: '#/components/responses/500-Internal-Server-Error'
      security:
        - authorization: []
      servers:
        - url: 'https://public-api.live.buildops.com'
          description: Production Server
        - url: 'https://public-api.dev.buildops.com'
          description: Development Server
  '/v1/properties/{propertyId}/tasks':
    get:
      tags:
        - Properties
      summary: Get all tasks on a property
      description: Get all tasks on a property
      operationId: get-v1-properties-tasks
      parameters:
        - $ref: '#/components/parameters/Authorization'
        - $ref: '#/components/parameters/tenantId'
        - name: propertyId
          in: path
          description: Property ID
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Task'
        '400':
          $ref: '#/components/responses/400-Bad-Request'
        '401':
          $ref: '#/components/responses/401-Unauthorized'
        '403':
          $ref: '#/components/responses/403-Forbidden'
        '404':
          $ref: '#/components/responses/404-Not-Found'
        '500':
          $ref: '#/components/responses/500-Internal-Server-Error'
      security:
        - authorization: []
      servers:
        - url: 'https://public-api.dev.buildops.com'
          description: Development Server
        - url: 'https://public-api.live.buildops.com'
          description: Production Server
    post:
      tags:
        - Properties
      summary: Create task in property
      description: Create a new task within a specific property. Tasks represent work items that need to be completed at a property location.
      operationId: create-v1-property-task
      parameters:
        - $ref: '#/components/parameters/Authorization'
        - $ref: '#/components/parameters/tenantId'
        - name: propertyId
          in: path
          description: Property ID
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: Task name
                  example: Property Maintenance Check
                description:
                  type: string
                  nullable: true
                  description: Task description
                  example: Perform routine maintenance check on property systems
                assetId:
                  type: string
                  nullable: true
                  description: Associated asset ID
                  format: uuid
                  example: 123e4567-e89b-12d3-a456-426614174000
                taskEntries:
                  type: array
                  nullable: true
                  description: Task entries containing products and quantities
                  items:
                    type: object
                    properties:
                      productId:
                        type: string
                        description: Product ID for the task entry
                        format: uuid
                        example: 123e4567-e89b-12d3-a456-426614174003
                      description:
                        type: string
                        description: Description of the task entry
                        example: Replace air filter
                      quantity:
                        type: number
                        description: Quantity of the product
                        example: 1
                    required:
                      - productId
                      - description
                      - quantity
              required:
                - name
      responses:
        '201':
          description: Task created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '400':
          $ref: '#/components/responses/400-Bad-Request'
        '401':
          $ref: '#/components/responses/401-Unauthorized'
        '403':
          $ref: '#/components/responses/403-Forbidden'
        '404':
          $ref: '#/components/responses/404-Not-Found'
        '500':
          $ref: '#/components/responses/500-Internal-Server-Error'
      security:
        - authorization: []
      servers:
        - url: 'https://public-api.dev.buildops.com'
          description: Development Server
        - url: 'https://public-api.live.buildops.com'
          description: Production Server
  '/v1/customers/{id}/representatives':
    post:
      tags:
        - Representatives
      summary: Add Customer Representative by customerId
      description: Add Customer Representative by customerId
      operationId: post-customers-id-reps
      parameters:
        - $ref: '#/components/parameters/Authorization'
        - $ref: '#/components/parameters/tenantId'
        - name: id
          in: path
          description: Customer ID
          required: true
          schema:
            type: string
            format: uuid
            example: 6ab7fe81-70a2-4d64-a996-ff8f9a360862
          examples:
            default:
              value: 6ab7fe81-70a2-4d64-a996-ff8f9a360862
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                isDoNotCall:
                  type: boolean
                  nullable: true
                  default: false
                isEmailOptOut:
                  type: boolean
                  nullable: true
                  default: false
                isSmsOptOut:
                  type: boolean
                  nullable: true
                  default: false
                salutation:
                  type: string
                  nullable: true
                name:
                  type: string
                  nullable: true
                firstName:
                  type: string
                  nullable: true
                lastName:
                  type: string
                  nullable: true
                middleName:
                  type: string
                  nullable: true
                nickName:
                  type: string
                  nullable: true
                profilePictureUrl:
                  type: string
                  nullable: true
                userTitle:
                  type: string
                  nullable: true
                email:
                  type: string
                  nullable: true
                  format: email
                cellPhone:
                  type: string
                  nullable: true
                contactRole:
                  type: string
                  nullable: true
                bestContact:
                  type: string
                  nullable: true
                landlinePhone:
                  type: string
                  nullable: true
                contactType:
                  type: string
                  nullable: true
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerRepresentative'
        '400':
          $ref: '#/components/responses/400-Bad-Request'
        '401':
          $ref: '#/components/responses/401-Unauthorized'
        '403':
          $ref: '#/components/responses/403-Forbidden'
        '404':
          $ref: '#/components/responses/404-Not-Found'
        '500':
          $ref: '#/components/responses/500-Internal-Server-Error'
      security:
        - authorization: []
      servers:
        - url: 'https://public-api.live.buildops.com'
          description: Production Server
        - url: 'https://public-api.dev.buildops.com'
          description: Development Server
      x-internal: false
  '/v1/properties/{id}/representatives':
    post:
      tags:
        - Representatives
      summary: Create a Customer Representative with propertyId
      description: Create a Customer Representative with propertyId
      operationId: post-v1-properties-id-representatives

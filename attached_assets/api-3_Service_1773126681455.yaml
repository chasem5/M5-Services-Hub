  /v1/jobs:
    get:
      tags:
        - Jobs
      summary: Get Jobs List
      description: |-
        The 'get jobs list by tenant id' endpoint retrieves a list of jobs associated with a specific tenant. Jobs represent tasks, projects, or work items that have a relationship with the given tenant. This endpoint allows you to fetch a collection of job objects, each containing relevant information such as job ID, title, description, status, and any other associated data.

        To use this endpoint, you will provide the tenant ID as a parameter in the API request to identify the specific tenant whose jobs you want to retrieve. The API will then process the request and return a list of job objects tied to the provided tenant ID.

        The response from the API will include detailed information about each job, allowing you to view and manage the jobs associated with the identified tenant efficiently.

        It is important to note that this endpoint may support pagination if the number of jobs associated with the tenant is substantial. Pagination enables you to retrieve jobs in smaller, manageable chunks rather than receiving the entire list in a single response.
      operationId: getJobById
      parameters:
        - $ref: '#/components/parameters/Authorization'
        - $ref: '#/components/parameters/tenantId'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/page_size'
        - name: job_number
          in: query
          description: Job number that you want to filter by.
          schema:
            type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  query:
                    type: object
                    properties:
                      page:
                        type: number
                      page_size:
                        type: number
                      limit:
                        type: number
                  totalCount:
                    type: number
                    example: 500
                  links:
                    $ref: '#/components/schemas/Links'
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Job'
        '400':
          $ref: '#/components/responses/400-Bad-Request'
        '401':
          $ref: '#/components/responses/401-Unauthorized'
        '403':
          $ref: '#/components/responses/403-Forbidden'
        '500':
          $ref: '#/components/responses/500-Internal-Server-Error'
      security:
        - authorization: []
      servers:
        - url: 'https://public-api.live.buildops.com'
          description: Production Server
        - url: 'https://public-api.dev.buildops.com'
          description: Development Server
